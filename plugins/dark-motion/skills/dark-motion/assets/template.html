</script><script>
(async()=>{
/* ============ KONFIGURASI PROYEK ============
   Diisi otomatis oleh assemble.py dari build/project.json. Jangan diedit di sini. */
/* === CONFIG === */
/* ============================================ */

const R=document.documentElement;
R.dataset.glow = GLOW ? 'on' : 'off';
R.dataset.font = FONT_MODE;
R.dataset.body = FONT_BODY;
R.style.setProperty('--c1', C1);
R.style.setProperty('--c2', C2);
/* warna tulisan di atas blok aksen: gelap kalau aksennya terang, putih kalau aksennya gelap */
function inkFor(hex){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h.slice(0,6),16);
 const ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
 return (.2126*ch[0]+.7152*ch[1]+.0722*ch[2])>.32?'#0b0b0d':'#ffffff';}
R.style.setProperty('--k1ink', inkFor(C1));
R.style.setProperty('--k2ink', inkFor(C2));

const fontsToLoad=['400 40px I','500 40px I','600 40px I','700 40px I','800 40px I','900 40px I',
 'italic 700 40px PF','italic 800 40px PF','italic 900 40px PF','400 40px JB','500 40px JB','700 40px JB'];
if(FONT_MODE==='custom'||FONT_BODY==='custom')fontsToLoad.push('400 40px UF','700 40px UF');
if(FONT_MODE==='preset')fontsToLoad.push('400 40px PK','italic 400 40px PK','800 40px PK','italic 800 40px PK');
if(FONT_BODY==='preset')fontsToLoad.push('400 40px PB','500 40px PB','600 40px PB','700 40px PB','800 40px PB');
await Promise.all(fontsToLoad.map(f=>document.fonts.load(f).catch(()=>{})));

const stage=document.getElementById('stage'),cam=document.getElementById('cam'),vidW=document.getElementById('vidW'),
 ov=document.getElementById('ov'),under=document.getElementById('under'),xbg=document.getElementById('xbg'),
 flash=document.getElementById('flash'),grainEl=document.getElementById('grain');

const tl=gsap.timeline({paused:true});
const SFX=[];const sfx=(t,type,g=1)=>{if(USE_SFX)SFX.push([+t.toFixed(3),type,g]);};
const perFrame=[],VIDS=[],PRELOAD=[];

/* ---------- helper dasar ---------- */
function mk(p,html='',cls='',css={}){const e=document.createElement('div');if(cls)e.className=cls;e.innerHTML=html;Object.assign(e.style,css);p.appendChild(e);return e;}
/* A(): elemen absolut berpusat di (x,y).  P(): elemen absolut dengan pojok kiri-atas di (x,y). */
function A(p,x,y,html,cls='',css={}){const e=mk(p,html,'ab '+cls,Object.assign({left:x+'px',top:y+'px'},css));gsap.set(e,{xPercent:-50,yPercent:-50});return e;}
function P(p,x,y,html,cls='',css={}){return mk(p,html,'ab '+cls,Object.assign({left:x+'px',top:y+'px'},css));}
/* grp(t0,t1): wadah yang hanya terlihat dari t0 sampai t1. Hampir semua scene dimulai dari sini. */
function grp(t0,t1,p=ov){const g=mk(p,'','L');tl.set(g,{visibility:'hidden'},0);tl.set(g,{visibility:'visible'},t0);if(t1!=null)tl.set(g,{visibility:'hidden'},t1);return g;}
/* stack(items, yTengah, gap): susun elemen (dibuat dengan A()) jadi SATU blok rapat yang ditengahkan di yTengah.
 gap = angka px atau array per sela; default 0,22 x tinggi elemen yang lebih kecil (maks 36). Teks yang berkaitan WAJIB lewat stack(). */
function stack(items,y,gap){const hs=items.map(e=>e.offsetHeight);
 const gp=i=>Array.isArray(gap)?gap[i]:(gap!=null?gap:Math.min(36,Math.round(Math.min(hs[i],hs[i+1])*.22)));
 let tot=hs.reduce((a,b)=>a+b,0);for(let i=0;i<items.length-1;i++)tot+=gp(i);
 let cy=y-tot/2;items.forEach((e,i)=>{e.style.top=(cy+hs[i]/2)+'px';cy+=hs[i]+(i<items.length-1?gp(i):0);});
 return {top:y-tot/2,bottom:y+tot/2};}
function hide(el){tl.set(el,{opacity:0},0);}
function fadeIn(el,t,d=.4,from={y:30,filter:'blur(14px)'}){tl.fromTo(el,Object.assign({opacity:0},from),{opacity:1,x:0,y:0,scale:1,rotation:0,filter:'blur(0px)',duration:d,ease:'power3.out'},t);}
function exit(g,t,d=.18){tl.to(g,{opacity:0,filter:'blur(10px)',duration:d,ease:'power2.in'},t-d);}
function shake(t,amp=14,d=.32){tl.to(cam,{keyframes:[{x:amp,y:-amp*.6},{x:-amp*.8,y:amp*.5},{x:amp*.5,y:amp*.3},{x:-amp*.3,y:-amp*.2},{x:0,y:0}],duration:d,ease:'none'},t);}
function pre(src){const i=new Image();i.src=src;PRELOAD.push(i);return src;}
const svgNS=(w,h,inner,css='')=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" style="display:block;${css}">${inner}</svg>`;

/* === ICONS === */

/* ---------- scrim: gradien hitam yang memudar halus ---------- */
/* Dipakai setiap kali teks berdiri di atas footage terang atau ramai. */
function scrimT(t0,t1,h=900){const e=mk(under,'','',{position:'absolute',left:0,right:0,top:0,height:h+'px',background:'linear-gradient(180deg,var(--ease))'});
 hide(e);tl.to(e,{opacity:1,duration:.2},t0-.18);tl.to(e,{opacity:0,duration:.14},t1-.14);return e;}
function scrimB(t0,t1,cy){const top=Math.max(0,cy-340);const e=mk(under,'','',{position:'absolute',left:0,right:0,top:top+'px',bottom:0,background:'linear-gradient(0deg,var(--ease))'});

/**
 * cap(tOut, y, lines, off, gaps)
 *   lines : [[ [teks, detik, kelas?, styleOpsional?], ... ], ...]
 *   kelas : 'n' | 's' | 'k1' | 'k2' | 'k' (blok warna) | 'k alt' (blok warna aksen 2) | 'X'
 *   off   : offset x per baris; kosongkan untuk zig-zag otomatis. Baris blok 'k' sebaiknya [0].
 *   gaps  : margin-top per baris; untuk baris 'k' pakai 10-16 supaya blok tidak menempel.
 */
function cap(t1,y,lines,off,gaps){
 const c=mk(ov,'','cap',{top:y+'px'});gsap.set(c,{xPercent:-50,yPercent:-50});let t0=1e9;
 const sizes=lines.map(lineSize);
 const hasK=lines.map(L=>L.some(([a,b,cl])=>base(cl)==='k'));
 if(!off){const big=sizes.map(s=>s>60);
  off=lines.length===1?[0]:lines.length===2?(big[1]&&!big[0]?[-46,40]:big[0]&&!big[1]?[30,-46]:[-34,34]):[-50,0,50];
  off=off.map((o,i)=>hasK[i]?0:o);}
 lines.forEach((L,li)=>{const ln=mk(c,'','ln');
  let top='n',topSt=null;L.forEach(([a,b,cl='n',st])=>{if(RANK[base(cl)]>=RANK[base(top)]){top=cl;topSt=st;}});
  const strut=document.createElement('span');strut.className='cw '+top;strut.textContent='​';
  Object.assign(strut.style,{display:'inline-block',width:'0',margin:'0',padding:'0',visibility:'hidden',background:'none'});
  if(topSt&&topSt.fontSize)strut.style.fontSize=topSt.fontSize;ln.appendChild(strut);
  if(li>0){const m=Math.max(sizes[li],sizes[li-1]);let gp=m>60?-Math.round(m*.13):-4;
   if(sizes[li]<60&&sizes[li-1]>=150)gp=2;if(hasK[li]||hasK[li-1])gp=12;if(gaps&&gaps[li]!=null)gp=gaps[li];ln.style.marginTop=gp+'px';}
  ln.style.transform=`translateX(${off[li]||0}px)`;
  const firstBig=L.findIndex(([a,b,cl='n'])=>base(cl)!=='n');
  L.forEach(([txt,t,cls='n',st],wi)=>{const s=document.createElement('span');s.className='cw '+cls;s.style.display='none';
   s.textContent=txt;
   if(base(cls)==='n'&&firstBig>wi&&li>0&&base(top)!=='k'){s.style.alignSelf='flex-start';s.style.marginTop=Math.round(sizes[li]*.16)+'px';}
   if(st)Object.assign(s.style,st);ln.appendChild(s);
   const tt=t-.04;t0=Math.min(t0,tt);wIn(s,tt,cls);s._t=t;});});
 tl.set(c,{visibility:'hidden'},0);tl.set(c,{visibility:'visible'},t0-.01);
 tl.to(c,{opacity:0,duration:.1},t1-.1);tl.set(c,{visibility:'hidden'},t1);
 CAPS.push([c,t0,t1]);return c;}

      filter:'drop-shadow(0 0 18px rgba(240,180,90,.35)) drop-shadow(0 4px 10px rgba(0,0,0,.8))'});
    tl.fromTo(e,{opacity:0,y:26,filter:'blur(14px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.4,ease:'power3.out'},tt());
    y+=sz*.45; return e;});
  if(tag){y+=40*s;const bar=`<span style="display:inline-block;width:${70*s}px;height:2px;background:${tagColor};vertical-align:middle;margin:0 ${18*s}px"></span>`;
    out.tag=A(p,cx,y,bar+tag+bar,'',{font:`600 ${Math.round(26*s)}px JB`,letterSpacing:'.2em',color:tagColor,textShadow:'0 0 12px rgba(240,180,90,.45),0 2px 6px #000'});
    tl.fromTo(out.tag,{opacity:0,y:26,filter:'blur(14px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.4,ease:'power3.out'},tt());}
  return out;}

/* PANAH CTA tebal: panah datar solid dua warna (sisi kanan sedikit lebih gelap), memantul pelan.
   Ikon garis tipis (arrow-down) terlalu lemah untuk ajakan; pakai ini. dir: 'down' | 'up'. */
function bigArrow(p,x,y,w=190,{c1='#FF4A14',c2='#E1380C',dir='down',t=null}={}){
  const id='ar'+Math.random().toString(36).slice(2,7);
  const svg=svgNS(200,220,`<defs><clipPath id="${id}"><rect x="100" y="-20" width="140" height="260"/></clipPath></defs>
    <g stroke-linejoin="round" stroke-width="16">
      <path d="M68 8 H132 V104 H188 L100 210 L12 104 H68 Z" fill="${c1}" stroke="${c1}"/>
      <path d="M68 8 H132 V104 H188 L100 210 L12 104 H68 Z" fill="${c2}" stroke="${c2}" clip-path="url(#${id})"/>
    </g>`,`width:${w}px;height:${w*1.1}px;overflow:visible;${dir==='up'?'transform:rotate(180deg)':''}`);
  const e=A(p,x,y,`<div class="bob">${svg}</div>`,'',{filter:`drop-shadow(0 0 26px ${c1}73) drop-shadow(0 10px 18px rgba(0,0,0,.6))`});
  if(t!=null){tl.fromTo(e,{opacity:0,y:-60,scale:.7},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(1.6)'},t);
    const bob=e.querySelector('.bob');
    perFrame.push(tt=>{if(tt<t+.4)return;bob.style.transform=`translateY(${(Math.abs(Math.sin((tt-t-.4)*3.4))*26*(dir==='up'?-1:1)).toFixed(1)}px)`;});}
  return e;}

 const fr=Math.round(t*30);
 if(GRAIN_MODE==='move')grainEl.style.backgroundPosition=`${(fr*73)%256}px ${(fr*151)%256}px`;
 perFrame.forEach(f=>f(t));
 await Promise.all([ivUpdate(t),vidUpdate(t)]);};
await seek(0);window.READY=true;
})().catch(e=>{console.error('TEMPLATE ERROR',e);window.TEMPLATE_ERROR=String(e&&e.stack||e);});
